<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Website Yayasan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-lg w-full max-w-sm p-6">
    <h1 class="text-2xl font-bold text-slate-800 text-center mb-1">Yayasan Internal</h1>
    <p class="text-sm text-slate-500 text-center mb-6">Silakan masuk untuk melanjutkan</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input type="text" id="username" required autocomplete="username"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"
               placeholder="mis. anggota">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required autocomplete="current-password"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"
               placeholder="••••••••">
      </div>

      <button type="submit" id="btnLogin"
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition">
        Masuk
      </button>

      <p id="errorMsg" class="text-sm text-red-600 text-center hidden"></p>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const form = document.getElementById('loginForm');
    const btn = document.getElementById('btnLogin');
    const errBox = document.getElementById('errorMsg');

    // Kalau sudah login, langsung ke dashboard
    (async () => {
      const session = await getSession();
      if (session) window.location.href = 'dashboard.html';
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      errBox.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Memproses...';

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;

      try {
        await login(username, password);
        window.location.href = 'dashboard.html';
      } catch (err) {
        errBox.textContent = 'Username atau password salah.';
        errBox.classList.remove('hidden');
        btn.disabled = false;
        btn.textContent = 'Masuk';
      }
    });
  </script>
</body>
</html>
