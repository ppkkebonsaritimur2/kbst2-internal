<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Website Yayasan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen flex items-center justify-center p-4">

  <div class="bg-white rounded-2xl shadow-lg w-full max-w-sm p-6">
    <h1 class="text-2xl font-bold text-slate-800 text-center mb-1">Yayasan Internal</h1>
    <p class="text-sm text-slate-500 text-center mb-6">Silakan masuk untuk melanjutkan</p>

    <form id="loginForm" class="space-y-4">
      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Username</label>
        <input type="text" id="username" required autocomplete="username"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"
               placeholder="mis. admin">
      </div>

      <div>
        <label class="block text-sm font-medium text-slate-700 mb-1">Password</label>
        <input type="password" id="password" required autocomplete="current-password"
               class="w-full px-3 py-2 border border-slate-300 rounded-lg focus:outline-none focus:ring-2 focus:ring-emerald-500"
               placeholder="••••••••">
      </div>

      <button type="submit" id="btnLogin"
              class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-semibold py-2.5 rounded-lg transition">
        Masuk
      </button>

      <p id="errorMsg" class="text-sm text-red-600 text-center hidden break-all"></p>
      <pre id="debugBox" class="text-[10px] text-slate-500 bg-slate-50 p-2 rounded mt-2 whitespace-pre-wrap break-all"></pre>
    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    const debugBox = document.getElementById('debugBox');
    function log(msg) {
      debugBox.textContent += msg + '\n';
    }

    log('1. Config loaded. URL=' + SUPABASE_URL);
    log('2. supabase global=' + (typeof window.supabase));
    log('3. sb client=' + (typeof sb));

    // Cek sudah login atau belum
    (async () => {
      try {
        const session = await getSession();
        log('4. Session awal=' + (session ? 'ADA' : 'KOSONG'));
        if (session) {
          log('5. Redirect ke dashboard...');
          window.location.href = 'dashboard.html';
        }
      } catch (e) {
        log('4. ERROR cek session: ' + e.message);
      }
    })();

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      debugBox.textContent = '';
      log('A. Submit ditekan');

      const username = document.getElementById('username').value;
      const password = document.getElementById('password').value;
      log('B. Username input: "' + username + '"');
      log('C. Password length: ' + password.length);
      log('D. Email hasil konversi: ' + usernameToEmail(username));

      try {
        const result = await login(username, password);
        log('E. LOGIN SUKSES');
        log('F. User email: ' + result.user.email);
        log('G. User role: ' + JSON.stringify(result.user.app_metadata));
        log('H. Redirect ke dashboard...');
        
        // Delay sebentar biar log kebaca
        setTimeout(() => {
          window.location.href = 'dashboard.html';
        }, 1500);
      } catch (err) {
        log('E. LOGIN GAGAL');
        log('F. Pesan: ' + (err.message || 'tidak ada message'));
        log('G. Status: ' + (err.status || '-'));
        log('H. Code: ' + (err.code || '-'));
        document.getElementById('errorMsg').textContent = 'ERROR: ' + (err.message || JSON.stringify(err));
        document.getElementById('errorMsg').classList.remove('hidden');
      }
    });
  </script>
</body>
</html>
