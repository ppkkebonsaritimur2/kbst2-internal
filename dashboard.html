<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard — Yayasan</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-100 min-h-screen">

  <nav class="bg-emerald-700 text-white px-4 py-3 flex justify-between items-center">
    <h1 class="font-semibold">Yayasan Internal</h1>
    <button onclick="logout()" class="text-sm bg-emerald-800 hover:bg-emerald-900 px-3 py-1.5 rounded">
      Keluar
    </button>
  </nav>

  <main class="p-4 max-w-3xl mx-auto">
    <h2 class="text-xl font-bold text-slate-800 mb-1">Selamat datang 👋</h2>
    <p class="text-slate-600 mb-6">Login berhasil. Dashboard masih kosong — akan kita isi di tahap berikutnya.</p>

    <div class="bg-white rounded-xl p-5 shadow-sm">
      <p class="text-sm text-slate-500">Anda login sebagai:</p>
      <p id="whoami" class="font-mono text-slate-800 text-sm mt-1">memuat...</p>
      <p class="text-sm text-slate-500 mt-3">Role:</p>
      <p id="roleInfo" class="font-mono text-slate-800 text-sm mt-1">memuat...</p>
    </div>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    (async () => {
      const session = await requireAuth();
      if (!session) return;
      document.getElementById('whoami').textContent = session.user.email;
      document.getElementById('roleInfo').textContent = session.user.app_metadata?.role || '-';
    })();
  </script>
</body>
</html>
